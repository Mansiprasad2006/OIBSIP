<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AurumCalc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator" aria-label="AurumCalc calculator">

    <header class="calculator__header">
      <h1 class="calculator__brand">Aurum<span>Calc</span></h1>
    </header>

    <section class="screen" aria-label="Calculator display">
      <div class="screen__history" id="history" aria-hidden="true"></div>
      <div class="screen__result" id="display">0</div>
    </section>

    <div class="keys">

      <button type="button" class="key key--fn" data-action="clear">C</button>
      <button type="button" class="key key--fn" data-action="backspace" aria-label="Backspace">⌫</button>
      <button type="button" class="key key--fn key--placeholder" data-action="none" tabindex="-1" aria-hidden="true"></button>
      <button type="button" class="key key--op" data-op="÷">÷</button>

      <button type="button" class="key key--num" data-num="7">7</button>
      <button type="button" class="key key--num" data-num="8">8</button>
      <button type="button" class="key key--num" data-num="9">9</button>
      <button type="button" class="key key--op" data-op="×">×</button>

      <button type="button" class="key key--num" data-num="4">4</button>
      <button type="button" class="key key--num" data-num="5">5</button>
      <button type="button" class="key key--num" data-num="6">6</button>
      <button type="button" class="key key--op" data-op="−">−</button>

      <button type="button" class="key key--num" data-num="1">1</button>
      <button type="button" class="key key--num" data-num="2">2</button>
      <button type="button" class="key key--num" data-num="3">3</button>
      <button type="button" class="key key--op" data-op="+">+</button>

      <button type="button" class="key key--num key--zero" data-num="0">0</button>
      <button type="button" class="key key--num" data-action="decimal">.</button>
      <button type="button" class="key key--equals" data-action="equals">=</button>

    </div>

  </main>

<script src="script.js"></script>
</body>
</html>
